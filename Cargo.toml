[workspace]
resolver = "2"
members = [
    "copad-core",
    "copad-usage",
    "copad-daemon",
    "copad-linux",
    "copad-cli",
    "copad-ffi",
    "copad-term",
    "copad-keys",
    "copad-mux",
    "copad-mux-proto",
    "plugins/echo",
    "plugins/kb",
    "plugins/calendar",
    "plugins/slack",
    "plugins/llm",
    "plugins/todo",
    "plugins/git",
    "plugins/discord",
    "plugins/bookmark",
    "plugins/jira",
    "plugins/docs",
    "plugins/web-bridge",
    "plugins/pilot",
    "plugins/claude",
    "plugins/pomodoro",
]

[workspace.package]
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "Cross-platform custom terminal emulator"
repository = "https://github.com/marshallku/copad"

# alacritty_terminal 0.26.0 panics on the 4097th kitty keyboard push (it evicts from the
# title stack). Fixed upstream, unreleased: see vendor/alacritty_terminal/COPAD-PATCH.md.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

