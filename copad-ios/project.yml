# xcodegen spec for the copad iOS shell. Generate the (gitignored) .xcodeproj:
#   cd copad-ios && xcodegen generate
# See README.md. The pbxproj is generated so this YAML stays the reviewable SoT.
name: copad-ios
options:
  bundleIdPrefix: com.marshall.copad
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
# The native comux client speaks SSH itself (decisions #168): apple/swift-nio-ssh.
packages:
  swift-nio-ssh:
    url: https://github.com/apple/swift-nio-ssh
    exactVersion: 0.15.0
  swift-nio:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.104.0
settings:
  base:
    # Ad-hoc ("-") signing needs no developer team, so `xcodebuild -sdk
    # iphonesimulator` still builds on any machine — but unlike CODE_SIGNING
    # off, it lets the Keychain entitlement (bearer-token persistence) apply.
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  copad-ios:
    type: application
    platform: iOS
    sources:
      - Sources
      # JetBrains Mono Nerd Font Mono (OFL, Resources/Fonts/OFL.txt): powerline + Nerd icons in
      # the terminal, one cell wide (decisions #174).
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marshall.copad.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Info.plist
      # aps-environment must match the profile: development for debug, production for TestFlight.
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: copad-ios.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: copad-ios.Release.entitlements
    dependencies:
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: copad
        # From the build settings, so fastlane's CURRENT_PROJECT_VERSION reaches TestFlight.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # SSH uses only standard, exempt encryption (same declaration as AIDE); without it every
        # TestFlight build waits on the export-compliance question (decisions #176).
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - JetBrainsMonoNerdFontMono-Regular.ttf
          - JetBrainsMonoNerdFontMono-Bold.ttf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Scoped ATS: allow cleartext ONLY to loopback/*.local for local dev.
        # The real Tailscale path is https://*.ts.net (needs no exception).
        # Never NSAllowsArbitraryLoads.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  copad-iosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: copad-ios
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.marshall.copad.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/copad-ios.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/copad-ios"
        BUNDLE_LOADER: "$(TEST_HOST)"
  copad-iosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: copad-ios
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.marshall.copad.ios.uitests
        TEST_TARGET_NAME: copad-ios
schemes:
  copad-ios:
    build:
      targets:
        copad-ios: all
    test:
      targets:
        - copad-iosTests
        - copad-iosUITests
