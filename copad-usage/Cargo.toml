[package]
name = "copad-usage"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared subscription rate-limit readout (Claude OAuth + Codex rollout) for coctl and comux"
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# rustls with BOTH the OS trust store (native-roots) and the bundled Mozilla roots (webpki) —
# same rationale as copad-cli: a corporate MITM CA that re-signs TLS is trusted like curl/claude,
# and webpki is kept as a fallback for a minimal environment with no system cert store.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
