# Hyprland WebKit panel-freeze automatic cure. See docs/troubleshooting.md "Plugin/webview panel
# frozen on last frame after Hyprland workspace switch" for the upstream-bug write-up.
#
# Drop this `[[triggers]]` block into your ~/.config/copad/config.toml.
#
# What it does
# ------------
# Hyprland's WebKitGTK 6.0 / wayland interaction leaves WebView panels stuck on their last frame
# after a same-monitor workspace cycle (reproduces with the official MiniBrowser). Cross-monitor
# switches did not trigger it on the dual-monitor setup we tested; other setups are not
# characterized. Mitigation: a 1px window resize round-trip via two separate
# `hyprctl dispatch resizewindowpixel` calls, targeting copad by `class:` so it works whatever
# window has focus on the returning workspace.
#
# The trigger fires on `window.restored`, published when the toplevel's
# `GDK_TOPLEVEL_STATE_SUSPENDED` bit clears. `system.spawn` is trigger-only argv exec: it is
# intercepted at `LiveTriggerSink` and not registered in `ActionRegistry`, so
# `coctl call system.spawn` from a process holding COPAD_SOCKET gets `unknown_method`. The
# user-supplied `[[triggers]]` config is the trust boundary, as for `[keybindings]` `spawn:`.
#
# This is a user-config trigger, not a hardcoded fix, so copad ships no Hyprland-specific code
# (other compositors don't toggle SUSPENDED the same way, making it a no-op there) and you can
# delete it when WebKit/Hyprland fix the bug.
#
# Why `sh -c` is safe here
# ------------------------
# `system.spawn` does not wrap argv in a shell: each `{event.*}` / `{context.*}` interpolation
# lands as a literal argv element that shell metacharacters cannot re-parse. `["sh", "-c", ...]`
# opts out: every interpolated value in that string IS shell-evaluated.
#
# This snippet is safe only because (a) every argv element is a literal, with no `{event.X}` or
# `{context.X}` inside the shell string, and (b) `window.restored` emits an empty `{}` payload.
#
# Do NOT copy this `sh -c` pattern to a trigger that interpolates ANY field. A `slack.mention`
# `text` or a `{context.active_cwd}` directory name can be attacker-controlled and would run
# arbitrary code. Use the bare argv form (`argv = ["program", "arg1", ...]`) there.

[[triggers]]
name = "hyprland-webkit-cure"
action = "system.spawn"

[triggers.when]
event_kind = "window.restored"

# `system.spawn` is a privileged action — every trigger that wires
# it needs the explicit opt-in. See `docs/harness-integration.md`
# § Trust boundary. Origin gate stays default (`accept_external`
# false) since `window.restored` is plugin-published (Internal).
[triggers.security]
allow_privileged = true

[triggers.params]
# Two empirical choices (observed reliably; the mechanism of #2 is not characterized):
#
# 1. `resizewindowpixel` with a `class:com.marshall.copad` selector, NOT `resizeactive`. The
#    trigger fires on workspace return regardless of focus, so the active window is often not
#    copad, and `resizeactive` would resize that other window and leave copad frozen.
#
# 2. Two SEPARATE `hyprctl dispatch` calls chained with `&&`, NOT `hyprctl --batch "...; ..."`.
#    `--batch` consistently fails to cure; two separate IPC calls consistently do.
#
# The second call uses `dispatch -- resize...` because `-1 0,...` starts with `-` and hyprctl
# would otherwise parse it as a flag.
#
# `&&` needs `sh -c`, which opts out of the argv-only safety of `system.spawn` (see the safety
# note at the top of this file).
argv = [
    "sh",
    "-c",
    "hyprctl dispatch resizewindowpixel '1 0,class:com.marshall.copad' && hyprctl dispatch -- resizewindowpixel '-1 0,class:com.marshall.copad'",
]

# How to verify
# -------------
# 1. Install: `./scripts/install-dev.sh --restart` (or your usual
#    install path).
# 2. Open a plugin panel (e.g. `coctl plugin open todo`).
# 3. Switch to another Hyprland workspace, then back to copad's.
# 4. Without this trigger: panel is frozen on its last frame; click
#    inside it to revive.
# 5. With this trigger: panel repaints automatically. Stderr from
#    copad shows `[copad] window.restored: SUSPENDED bit cleared`
#    followed by `[copad] trigger system.spawn pid=... argv=[...]`.
#
# If hyprctl isn't on PATH at copad's launch env (e.g. copad
# launched from a desktop entry that strips PATH), substitute the
# absolute path inside the same `sh -c` form (keep the `&&` chain
# and the `class:` selector — see decision notes above):
#
#   argv = [
#       "sh", "-c",
#       "/usr/bin/hyprctl dispatch resizewindowpixel '1 0,class:com.marshall.copad' && /usr/bin/hyprctl dispatch -- resizewindowpixel '-1 0,class:com.marshall.copad'",
#   ]
