# Todo "start" → claude in a fresh worktree. Clicking "start" on a Todo pops a copad tab with
# claude-code running inside a tmux session in a fresh git worktree, with a layered prompt
# pre-seeded into claude. A chain of three triggers, linked by the auto-published
# `<action>.completed` events.
#
# Drop this whole file's `[[triggers]]` blocks into your ~/.config/copad/config.toml.
#
# Prereqs:
# - copad-plugin-todo registered. `todo.start` emits `todo.start_requested` with both `prompt`
#   (raw per-Todo frontmatter field, may be null) AND `assembled_prompt` (the LAYERED string
#   built at start time from `~/docs/claude/global.md` + `~/docs/claude/workspaces/<ws>.md` +
#   the Todo's `prompt` (or title+body) + linked_kb markdown contents). Other fields: id,
#   workspace, title, body, status, priority, due, linked_jira, linked_slack, linked_kb, tags.
#   The chain below feeds `assembled_prompt` forward; that is the agent-facing string.
# - copad-plugin-git registered. `git.worktree_add` creates the branch+dir and auto-emits
#   `git.worktree_add.completed {workspace, path, branch, base, prompt?}`. `prompt` only appears
#   when the upstream trigger forwards it via the optional `prompt` passthrough param.
# - `claude.start` spawns a copad tab with cwd=workspace_path, runs
#   `tmux new-session -A -s <name> claude`, and (when `prompt` is supplied) pastes the prompt
#   into claude's REPL once it is interactive, guarded by claude-specific capture-pane markers
#   AND `pane_current_command` so the prompt never lands in a shell pane.
#
# Layered prompt management:
# - `~/docs/claude/global.md`: common preamble for every agent session (coding rules, language
#   conventions, etc.). `scripts/install-plugins.sh` creates an empty stub.
# - `~/docs/claude/workspaces/<workspace>.md`: per-workspace context, selected by the Todo's
#   `workspace` field.
# - Per-Todo: `prompt` frontmatter (when set) is the explicit instruction; otherwise
#   `title + body`.
# - `linked_kb` paths get their full markdown content fanned in under `## Reference: <path>`.
# The assembly is late-bound to start time, so edits to any of these apply on the next click.
#
# Limitations:
# - Jira summary enrichment is not included: `linked_jira` shows up only as the raw key.
# - Re-clicking Start on the same Todo is supported. `git.worktree_add` is idempotent (it scans
#   existing worktrees for the target branch and echoes the recorded path), tmux re-attaches
#   the existing session, and a supplied `prompt` is re-pasted as a new turn.
#
# Flow:
#   click Start in Todo panel
#     → copad-plugin-todo emits todo.start_requested (raw `prompt` and `assembled_prompt`)
#     → trigger 1 or 2 fires git.worktree_add (branch from linked_jira, or todo-<id>); the
#       layered string is forwarded via its `prompt` passthrough so trigger 3 can see it
#     → registry auto-emits git.worktree_add.completed (its `prompt` is the passthrough field,
#       not todo.start_requested's `prompt`)
#     → trigger 3 fires claude.start with workspace_path + prompt
#     → new copad tab, fresh worktree, tmux session, claude REPL with the layered prompt
#       already pasted + submitted.
#
# Convention: the Todo plugin's `workspace` label and the git plugin's workspace `name` are
# assumed to coincide (todo.workspace = "copad" maps to `[[workspace]] name = "copad"` in
# workspaces.toml). To differ, hardcode `workspace = "<git-name>"` instead of
# `{event.workspace}`.

# ---------------------------------------------------------------------
# Trigger 1 — Todo with linked_jira → branch from sanitized Jira key.
#   "PROJ-456"      → branch `proj-456`
#   "epic/PROJ-456" → branch `epic/proj-456` (slash hierarchy preserved)
# `prompt` carries the layered prompt forward so trigger 3 can seed
# claude with it (see git.worktree_add's `prompt` passthrough).
# ---------------------------------------------------------------------
[[triggers]]
name = "vision3-start-with-jira"
action = "git.worktree_add"
params = { workspace = "{event.workspace}", branch = "{event.linked_jira}", sanitize_jira = true, prompt = "{event.assembled_prompt}" }
condition = "event.linked_jira != null"

[triggers.when]
event_kind = "todo.start_requested"

# ---------------------------------------------------------------------
# Trigger 2 — Todo without linked_jira → branch `todo-<id>`.
#   T-20260427-0042 → branch `todo-T-20260427-0042`
# Lowercasing isn't necessary for generated todo ids (already in the
# allowed charset), so sanitize_jira is left at default false.
# ---------------------------------------------------------------------
[[triggers]]
name = "vision3-start-without-jira"
action = "git.worktree_add"
params = { workspace = "{event.workspace}", branch = "todo-{event.id}", prompt = "{event.assembled_prompt}" }
condition = "event.linked_jira == null"

[triggers.when]
event_kind = "todo.start_requested"

# ---------------------------------------------------------------------
# Trigger 3 — Once the worktree exists (newly created OR matched by
# git.worktree_add's idempotent-scan), drop a Claude session there
# with the layered prompt pre-seeded. session_name auto-derived from
# the worktree path's last 2 components, so re-clicking the same
# Todo re-attaches the existing tmux session and re-pastes the
# prompt as a fresh turn.
# ---------------------------------------------------------------------
[[triggers]]
name = "vision3-claude-after-worktree"
action = "claude.start"
# `event.prompt` here is the passthrough field that
# `git.worktree_add` echoed into its result (and thus the
# auto-published `.completed` event). Triggers 1+2 fed it from
# `todo.start_requested`'s `assembled_prompt` — the field rename
# happens at the worktree-add step, not here.
params = { workspace_path = "{event.path}", prompt = "{event.prompt}" }

[triggers.when]
event_kind = "git.worktree_add.completed"

# ---------------------------------------------------------------------
# Optional: log every worktree creation to a daily KB file so you
# have a trail of what you kicked off. Hooks the SAME
# `git.worktree_add.completed` event the chain uses, so it fires
# alongside (not after) trigger 3. Uncomment if you want it.
# ---------------------------------------------------------------------
# [[triggers]]
# name = "vision3-log-worktree-creates"
# action = "kb.append"
# params = { id = "logs/worktrees.md", content = "- {event.workspace}/{event.branch} → {event.path}\n", ensure = true }
