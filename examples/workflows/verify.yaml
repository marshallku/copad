# /verify — browser screenshot + vision analysis on a URL
#
# Project-agnostic (require_project: false). The URL field carries both a pattern (^https?://)
# and max_length (500); both are load-bearing, since invalid URLs otherwise got through.
id: verify
name: /verify
description: |
  Run /verify on a URL — browser screenshot + vision analysis.
  Project-agnostic. Browser must be running with the control extension.
form_fields:
  - name: url
    label: URL
    type: text
    required: true
    placeholder: "https://example.com"
    pattern: "^https?://.+"
    max_length: 500
prompt: "/verify {url}"
