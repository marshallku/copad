# copad-mux configuration — copy to ~/.config/copad/mux.toml and edit.
#
# EVERYTHING here is optional. An absent file, or any omitted key, uses the built-in
# default (which reproduces copad-mux's out-of-the-box bindings). Bad values are warned
# about on startup (foreground `copad-mux server`, or the client at attach) and fall
# back to their default, so a typo never breaks the mux.
#
# Chord syntax (tmux-like): `C-` = Ctrl, `M-` = Alt/Meta (Option on macOS), `S-` = Shift.
#   examples: "C-b", "M-1", "C-S-h", "%", "Left", "Enter", "X"
# A letter's case implies Shift ("X" == "S-x"). `M-…` needs the terminal to send
# Option/Alt as Meta (iTerm: Left Option = Esc+; ghostty: macos-option-as-alt = true).

# ---- options ----
prefix = "C-b"            # the prefix key (tmux default)
mouse = true              # mouse: wheel-scroll, click-to-focus, click chrome to navigate
notify = true             # agent turn-completion desktop toasts (env COPAD_MUX_NOTIFY wins)
sidebar = true            # show the spaces+agents sidebar by default (Ctrl-b s toggles)
sidebar_width = 24        # sidebar columns            (clamped to 8..80)
sidebar_min_cols = 80     # hide the sidebar below this terminal width (>= width + 20)
scroll_step = 3           # lines per mouse-wheel notch (1..50)
sort_by = "created"       # session order in the sidebar / Ctrl-f switcher / )( cycle:
                          #   created (default) | alphabetical | recent | activity
usage = "bar"             # status-bar Claude/Codex rate-limit readout:
                          #   bar (default) — a progress bar per window on wide terminals
                          #     (5h ━━━╌╌╌╌╌ 34%), falling back to percentages when narrow
                          #   text — percentages only (claude 5h 5% wk 34% · codex wk 60%)
                          #   off  — hidden (same as COPAD_MUX_USAGE=0)
# Which rate-limit windows the readout shows. Default = all three. Ids:
#   claude-5h | claude-wk | codex-wk   (aliases: claude = both Claude windows, codex)
# An empty list hides the readout; unknown ids warn and are ignored.
# usage_windows = ["claude-wk", "codex-wk"]   # e.g. weekly windows only
usage_bar_width = 8       # cells per progress bar when usage = "bar"  (3..30)
usage_layout = "paged"    # how the readout is laid out:
                          #   paged (default) — ONE window at a time as a wheel/click-paged
                          #     carousel WITH a reset countdown + `n/N` indicator (scroll or
                          #     click the readout to page). The only layout that shows resets.
                          #   inline — the legacy single row of every window (no reset shown)
usage_page_unit = "window"  # carousel page granularity (usage_layout = "paged"):
                          #   window (default) — one rate-limit window per page (3 pages)
                          #   provider — all of a provider's windows on one page (2 pages)
                          #   metric — split by metric: page 1 = every window's usage %,
                          #     page 2 = every window's reset time (2 pages)
usage_reset = "relative"  # how the carousel shows a window's reset time:
                          #   relative (default) — countdown, e.g. ⟳ 2h13m
                          #   absolute — local clock, e.g. ⟳ 14:32 / ⟳ Wed 09:00
                          #   off — hide the reset
tab_labels = "number"     # what each status-bar tab chip shows:
                          #   number (default) — the 1-based index: ` 1 ` ` 2 `
                          #   name  — the tab's focused-pane process: ` claude ` ` nvim `
                          #   both  — index + process:  ` 1:claude `  (keeps Ctrl-b <n>)
update_check = true       # check GitHub releases in the background and show a
                          #   ⬆ x.y.z hint in the status bar when a newer version
                          #   exists (false / COPAD_MUX_UPDATE_CHECK=0 disables it)

# ---- session persistence (tmux-resurrect / continuum style) ----
# The layout (sessions, tabs, splits, per-pane cwd) is autosaved and restored when the
# server next starts, so a reboot/crash brings your workspace back. Shells restart fresh
# in their saved directory (running programs are NOT re-launched).
persist = true            # restore the saved layout on server start (delete the state
                          #   file, or set false, for a fresh start)
autosave_secs = 15        # periodic save interval; 0 disables (clamped to 5..3600)
                          # state file: $COPAD_MUX_STATE else ~/.local/state/copad/mux-session.json
# Re-run these programs on restore (by their command basename), tmux-resurrect style: if a
# pane's foreground command matches, its full command line is saved and re-run in the fresh
# shell. Default = the built-in AI agents (claude, codex, aider, cursor, gemini, opencode,
# droid, copilot, qwen, crush). Set [] to restore bare shells only; add your own (e.g.
# "nvim") to extend. (Restored panes start at the scrollback bottom — history isn't saved.)
# restore_processes = ["claude", "codex", "nvim"]
# When re-running a restored agent, RESUME its live conversation rather than starting fresh:
# claude → `claude --resume <id>`, codex → `codex resume <id>`, using the session the process
# was actually in (Claude's session id comes from ~/.claude/sessions/<pid>.json; Codex's from
# the rollout file it holds open). Safe runtime flags (e.g. --dangerously-skip-permissions,
# --model) carry over; the prompt and one-shot `-p` runs don't. Set false to always restart clean.
restore_agent_sessions = true

# ---- environment refresh (tmux `update-environment`) ----
# The persistent server freezes the environment it was BORN in, and every pane inherits it —
# so a server first started over SSH would leave every pane thinking it's remote (breaking
# local-only features like Claude in Chrome) even after you attach locally. These variable
# names are scrubbed from the server at startup and RE-INJECTED into each new pane from the
# CLIENT that spawns it, so a pane always reflects the session you attached from — not the one
# the server was born in. The first (boot) pane keeps the server's birth values. Load-bearing
# names (PATH, HOME, SHELL, …) are refused. Set [] to disable; the default is below.
# update_environment = ["DISPLAY", "WAYLAND_DISPLAY", "XAUTHORITY", "XDG_SESSION_TYPE",
#   "DBUS_SESSION_BUS_ADDRESS", "SSH_ASKPASS", "SSH_AUTH_SOCK", "SSH_AGENT_PID",
#   "SSH_CONNECTION", "SSH_CLIENT", "SSH_TTY", "WINDOWID", "KRB5CCNAME", "TERM_PROGRAM"]

# ---- git worktrees (`comux worktree create|list|rm`, tmx `twt`-style) ----
# `comux worktree create <branch>` runs `git worktree add -b <branch>` placing the new
# worktree as a SIBLING of the repo's main worktree, then opens a session in it and
# switches (Ctrl-b W does the same from the TUI, prompting for the branch).
[worktree]
# naming = "{repo}-{branch}"   # worktree dir name; tokens {repo} (main worktree dir) and
                               #   {branch} (with '/' -> '-'). Default shown.
# Per-repo post-create hook: repo main-worktree path -> shell command run via `bash -c`
# in the new worktree with $WORKTREE_PATH set (keys are ~-expanded).
# [worktree.scripts]
# "~/dev/copad" = "mise trust && yarn"

# ---- prefix bindings (pressed AFTER the prefix) ----
# Rebinding a key replaces that action's WHOLE default chord set. A value can be one
# chord or a list. Any action you don't mention keeps its default.
[keys]
# split-right = "%"
# split-down = "\""
# new-tab = "c"
# next-tab = "n"
# prev-tab = "p"
# close-tab = "&"
# rename-tab = ","        # custom tab name (shown over the process label; empty clears)
# tab-1 = "1"   … tab-9 = "9"
# new-session = "C"       # opens an inline name prompt
# new-worktree = "W"      # opens a branch prompt → git worktree + session
# rename-session = "$"
# kill-session = "X"      # y/n confirm
# next-session = ")"
# prev-session = "("
# notification-center = "a"
# jump-attention = "!"
# detach = ["d", "q"]
# close-pane = "x"
# toggle-sidebar = "s"
# redraw = "r"            # force a full repaint (tmux refresh-client) — clears any ghosting
# focus-sidebar = "e"     # keyboard-focus the sidebar (↑↓ list, ←→ spaces/agents, Enter, Esc)
# scrollback = "["
# focus-next = "o"
# focus-left = ["h", "Left"]
# focus-down = ["j", "Down"]
# focus-up = ["k", "Up"]
# focus-right = ["l", "Right"]
# resize-left = "H"
# resize-down = "J"
# resize-up = "K"
# resize-right = "L"

# ---- prefix-less bindings (tmux `bind -n`) ----
[global]
# popup = "C-f"                       # the Ctrl-f pane switcher
# tab-1 = "M-1"  … tab-9 = "M-9"      # Alt/Opt+number jump to a tab
# focus-left = ["C-S-h", "C-S-Left"]
# focus-down = ["C-S-j", "C-S-Down"]
# focus-up = ["C-S-k", "C-S-Up"]
# focus-right = ["C-S-l", "C-S-Right"]
