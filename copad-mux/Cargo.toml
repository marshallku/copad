[package]
name = "copad-mux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "copad agent-orchestration terminal multiplexer — authoritative state model + server"
repository.workspace = true

[dependencies]
# Shared subscription rate-limit readout (Claude OAuth + Codex rollout). comux
# calls it in-process for the status bar so it installs standalone — no runtime
# `coctl` dependency (decision #74).
copad-usage = { path = "../copad-usage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# User config parsing (~/.config/copad/mux.toml).
toml = "0.8"
thiserror = "2"
alacritty_terminal = "0.26"
# serde feature: lets Color/Modifier cross the client render protocol wire.
ratatui = { version = "0.29", features = ["serde"] }
# serde feature: lets crossterm KeyEvent be forwarded from client to server. Pinned
# to the exact version ratatui 0.29 re-exports so cargo unifies (no duplicate crate).
crossterm = { version = "0.28.1", features = ["serde"] }
libc = "0.2"
# Display-width-aware status-bar text placement (already in-tree via ratatui).
unicode-width = "0.2"
# GitHub-release update check for the status-bar "update available" hint
# (versionpoll). reqwest is already in-tree via copad-usage; mirror its TLS
# features (OS trust store + webpki roots) so a corporate CA is trusted.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
semver = "1"

[[bin]]
name = "comux"
path = "src/bin/comux.rs"

[dev-dependencies]
proptest = "1"
