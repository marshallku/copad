[package]
name = "copad-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C-ABI bridge from copad-core to platform UIs that can't link Rust directly (currently copad-macos)."
repository.workspace = true

[lib]
name = "copad_ffi"
# staticlib so libcopad_ffi.a embeds into Copad.app at link time.
crate-type = ["staticlib"]

[dependencies]
comux-host = { path = "../comux-host" }
copad-browser = { path = "../copad-browser" }
serde_json = "1"
copad-core = { path = "../copad-core" }
copad-mux-proto = { path = "../copad-mux-proto" }
copad-graph-web = { path = "../copad-graph-web" }
