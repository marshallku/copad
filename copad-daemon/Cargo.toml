[package]
name = "copad-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless host daemon for copad: trigger engine, action registry, event bus, plugin supervisor, socket server. GUI shells (copad-linux, copad-macos) and CLI (coctl) connect via Unix socket."
repository.workspace = true

[[bin]]
name = "copadd"
path = "src/main.rs"

[lib]
name = "copad_daemon"
path = "src/lib.rs"

[dependencies]
copad-core = { path = "../copad-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
wait-timeout = "0.2"
cron = "0.16"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# GitHub-release update check (update_check module): a daily poll that fires a
# native toast + `update.available` bus event when a newer release exists. Same
# TLS features as coctl (OS trust store + webpki roots) for corporate CAs.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
semver = "1"
