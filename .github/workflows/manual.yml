name: Manual

# Build the mdBook user manual and deploy it to GitHub Pages.
# Enable Pages once in the repo settings: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths:
      - "manual/**"
      - ".github/workflows/manual.yml"
  workflow_dispatch:

# Allow only one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.5.4"
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Build
        run: mdbook build manual
      - uses: actions/upload-pages-artifact@v3
        with:
          path: manual/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
