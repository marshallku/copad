name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev libdbus-1-dev

      # musl target for the static comux; cargo-zigbuild because musl-gcc rejects -m64 when
      # building ring (reqwest's rustls).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          # Stamp the tag's version into the workspace: comux's update check and `coctl update
          # check` compare CARGO_PKG_VERSION with the latest release.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo build --workspace --release

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      # Static comux for musl distros and hosts whose glibc is older than the runner's. Built
      # after the version sed so it self-reports the right version.
      - name: Build static comux (musl)
        run: |
          cargo zigbuild --release --target x86_64-unknown-linux-musl -p copad-mux

      - name: Bundle tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="copad-v${VERSION}-x86_64-linux.tar.gz"
          mkdir -p dist
          cp target/release/copad dist/
          cp target/release/coctl dist/
          cp target/release/comux dist/
          cp target/release/copadd dist/
          # Basename matches the GTK app_id so Wayland maps windows to this launcher.
          cp copad-linux/com.marshall.copad.desktop dist/
          cp -r copad-linux/icons dist/icons
          tar -czf "${ARCHIVE}" -C dist .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          # Standalone comux asset (no GTK, no daemon); install-comux.sh downloads this.
          COMUX_ASSET="comux-v${VERSION}-x86_64-linux"
          cp target/release/comux "${COMUX_ASSET}"
          echo "COMUX_ASSET=${COMUX_ASSET}" >> "$GITHUB_ENV"
          # The `-musl` suffix tells it apart; install-comux.sh picks it on musl systems.
          COMUX_MUSL_ASSET="comux-v${VERSION}-x86_64-linux-musl"
          cp target/x86_64-unknown-linux-musl/release/comux "${COMUX_MUSL_ASSET}"
          echo "COMUX_MUSL_ASSET=${COMUX_MUSL_ASSET}" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.COMUX_ASSET }}
            ${{ env.COMUX_MUSL_ASSET }}
          if-no-files-found: error
          retention-days: 3

  build-macos:
    name: Build macOS arm64
    # macos-15: Package.swift needs swift-tools-version 6.0, and the sources use trailing
    # commas in parameter lists (SE-0439, Swift 6.1+), which the default Xcode (Swift 6.0)
    # rejects; setup-xcode below selects the newest stable Xcode.
    runs-on: macos-15
    # Without these secrets (fork, unconfigured) the Stage step falls back to ad-hoc signing
    # instead of failing. See docs/macos-signing-notarization.md.
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # Notarization via App Store Connect API key (notarytool --key/--key-id/--issuer).
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Throwaway keychain so codesign finds the identity by name in the Stage step.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # -e is OFF on purpose: an import failure must not abort the job, because the Stage
          # step's gate then finds no identity and falls back to ad-hoc signing.
          set -uo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "signing cert secrets incomplete (need BASE64 + PASSWORD) — skipping import (ad-hoc fallback)"
            exit 0
          fi
          fallback() { echo "WARNING: $1 — release will fall back to ad-hoc signing. Check the MACOS_CERTIFICATE_* secrets."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/copad-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN" || fallback "create-keychain failed"
          security set-keychain-settings -lut 21600 "$KEYCHAIN" || true
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN" || fallback "unlock-keychain failed"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12" || fallback "base64 decode of cert failed"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            || fallback "cert import failed (wrong password or malformed .p12?)"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null \
            || fallback "set-key-partition-list failed"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g) || true
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "imported: $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application') Developer ID Application identity(ies)"

      # copad-linux needs GTK4/VTE and cannot build on Darwin, so list the crates explicitly.
      # Keep the plugin set in sync with install-macos.sh's MACOS_PLUGINS.
      - name: Build Rust crates (workspace minus copad-linux)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo build --release \
            -p copad-ffi \
            -p copad-term \
            -p copad-cli \
            -p copad-mux \
            -p copad-daemon \
            -p copad-plugin-echo \
            -p copad-plugin-git \
            -p copad-plugin-llm \
            -p copad-plugin-calendar \
            -p copad-plugin-kb \
            -p copad-plugin-todo \
            -p copad-plugin-pomodoro \
            -p copad-plugin-bookmark \
            -p copad-plugin-slack \
            -p copad-plugin-discord \
            -p copad-plugin-jira \
            -p copad-plugin-docs \
            -p copad-plugin-claude \
            -p copad-plugin-pilot \
            -p copad-plugin-web-bridge

      - name: Build Swift app
        working-directory: copad-macos
        run: swift build -c release

      - name: Stage Copad.app + ad-hoc codesign + assemble tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="copad-v${VERSION}-aarch64-apple-darwin.tar.gz"

          REPO_ROOT="$(pwd)"
          DIST="$REPO_ROOT/dist-macos"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          STAGING="$DIST/Copad.app"
          MACOS_DIR="$STAGING/Contents/MacOS"
          RESOURCES="$STAGING/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES"
          cp copad-macos/.build/release/Copad "$MACOS_DIR/Copad"
          if [[ -f copad-macos/Resources/AppIcon.icns ]]; then
            cp copad-macos/Resources/AppIcon.icns "$RESOURCES/AppIcon.icns"
          fi

          # The tag's version is baked into CFBundleVersion and CFBundleShortVersionString.
          # LSMinimumSystemVersion mirrors install-macos.sh.
          cat > "$STAGING/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Copad</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.marshall.copad</string>
              <key>CFBundleName</key>
              <string>copad</string>
              <key>CFBundleDisplayName</key>
              <string>copad</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          # Signing is deferred until every binary is staged, so one pass signs them all.

          cp target/release/coctl "$DIST/coctl"
          cp target/release/copadd "$DIST/copadd"
          cp target/release/comux "$DIST/comux"

          # Layout matches install-macos.sh. Keep this list in sync with its MACOS_PLUGINS
          # and the Build Rust crates step above.
          mkdir -p "$DIST/plugins"
          for name in echo git llm calendar kb todo pomodoro bookmark slack discord jira docs claude pilot web-bridge; do
            crate="copad-plugin-$name"
            src_dir="plugins/$name"
            bin_src="target/release/$crate"
            plugin_dir="$DIST/plugins/$name"
            mkdir -p "$plugin_dir"
            find "$src_dir" -maxdepth 1 -type f ! -name 'Cargo.toml' \
              -exec cp -f {} "$plugin_dir/" \;
            cp -f "$bin_src" "$plugin_dir/$crate"
            chmod 755 "$plugin_dir/$crate"
          done

          mkdir -p "$DIST/shell-hooks"
          cp copad-macos/shell-hooks/copad-cwd.* "$DIST/shell-hooks/"
          # Same context bridge install-macos.sh ships; keep the two in step.
          cp examples/shell/copad-context.zsh "$DIST/shell-hooks/"

          # HOME_PLACEHOLDER stays unexpanded (launchd does not expand `~`); installers
          # substitute their own. Ship the wrapper with the plist, which runs copadd through it.
          cp dist/launchd/com.marshall.copad.daemon.plist "$DIST/com.marshall.copad.daemon.plist"
          cp dist/launchd/copadd-launch.sh "$DIST/copadd-launch.sh"

          # Sign EVERY Mach-O (hardened runtime + timestamp) so macOS 26 does not delete
          # ad-hoc executables (copadd, plugins) on first spawn; only the .app is notarized.
          # See docs/macos-signing-notarization.md.
          # Gate on ALL inputs (identity, the three API-key secrets, cert in the keychain): a
          # partial config falls back to ad-hoc instead of failing at codesign/notarytool.
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ] \
             && [ -n "${APP_STORE_CONNECT_KEY_ID:-}" ] \
             && [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ] \
             && [ -n "${APP_STORE_CONNECT_KEY_P8:-}" ] \
             && security find-identity -v -p codesigning | grep -qF "$MACOS_SIGNING_IDENTITY"; then
            echo "==> Developer ID signing (identity: $MACOS_SIGNING_IDENTITY)"
            # Inside-out: leaf binaries first, then the app bundle.
            for b in "$DIST/coctl" "$DIST/copadd" "$DIST/comux"; do
              codesign --force --options runtime --timestamp \
                --sign "$MACOS_SIGNING_IDENTITY" "$b"
            done
            find "$DIST/plugins" -type f -name 'copad-plugin-*' -perm -u+x -print0 \
              | while IFS= read -r -d '' pbin; do
                  codesign --force --options runtime --timestamp \
                    --sign "$MACOS_SIGNING_IDENTITY" "$pbin"
                done
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$STAGING"
            codesign --verify --strict --verbose=2 "$STAGING"

            echo "==> notarizing $STAGING (App Store Connect API key)"
            P8="$RUNNER_TEMP/AuthKey.p8"
            # Wipe the private key even if decode/ditto/submit fails under set -e.
            trap 'rm -f "$P8"' EXIT
            if printf '%s' "$APP_STORE_CONNECT_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$P8"
            else
              printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$P8"
            fi
            ditto -c -k --keepParent "$STAGING" "$RUNNER_TEMP/Copad.zip"
            xcrun notarytool submit "$RUNNER_TEMP/Copad.zip" \
              --key "$P8" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --wait
            xcrun stapler staple "$STAGING"
            xcrun stapler validate "$STAGING"
            spctl -a -vvv --type exec "$STAGING" || true
          else
            echo "==> signing not fully configured (need MACOS_SIGNING_IDENTITY + APP_STORE_CONNECT_{KEY_ID,ISSUER_ID,KEY_P8} + an importable cert) — ad-hoc signing (Gatekeeper needs quarantine strip; not Tahoe-safe)"
            codesign --force --deep --sign - --timestamp=none "$STAGING"
            codesign -dv "$STAGING" 2>&1 | head -5 || true
          fi

          tar -czf "$ARCHIVE" -C "$DIST" .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          # Copy the signed $DIST/comux, not target/release/comux, so the comux-only installer
          # gets a Developer-ID-signed (Tahoe-safe) binary.
          COMUX_ASSET="comux-v${VERSION}-aarch64-apple-darwin"
          cp "$DIST/comux" "$COMUX_ASSET"
          echo "COMUX_ASSET=${COMUX_ASSET}" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.COMUX_ASSET }}
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/linux-x86_64/*.tar.gz
            artifacts/macos-aarch64/*.tar.gz
            artifacts/linux-x86_64/comux-*
            artifacts/macos-aarch64/comux-*
          generate_release_notes: false

  # Runs after the release exists: it downloads the published assets to checksum and
  # signature-verify them.
  homebrew:
    name: Update Homebrew tap
    needs: [release]
    uses: ./.github/workflows/homebrew.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
