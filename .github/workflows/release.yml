name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libvte-2.91-gtk4-dev libwebkitgtk-6.0-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          # Stamp the tag's version into the workspace so built binaries
          # self-report their true version via CARGO_PKG_VERSION. Git tags alone
          # don't bump Cargo.toml, and comux's status-bar update check +
          # `coctl update check` compare the running version against the latest
          # release — a stale CARGO_PKG_VERSION would make them misreport forever.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo build --workspace --release

      - name: Bundle tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="copad-v${VERSION}-x86_64-linux.tar.gz"
          mkdir -p dist
          cp target/release/copad dist/
          cp target/release/coctl dist/
          cp target/release/comux dist/
          # copadd: the background daemon. install.sh installs it + starts the
          # systemd --user unit (already shipped under dist/systemd/), so Linux
          # release users get the daemon (update-check notifications, triggers,
          # status bar) — not just the GUI.
          cp target/release/copadd dist/
          # Desktop file basename matches the GTK app_id so Wayland
          # compositors map running windows to this launcher entry.
          cp copad-linux/com.marshall.copad.desktop dist/
          # Carry the hicolor icon set so install.sh can lay it out
          # under share/icons/hicolor/<size>/apps/. The shape mirrors
          # the in-repo copad-linux/icons/ tree exactly.
          cp -r copad-linux/icons dist/icons
          tar -czf "${ARCHIVE}" -C dist .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          # Also publish comux as a standalone release asset — a single
          # self-contained binary (no GTK / no daemon) for users who want only
          # the multiplexer. install-comux.sh downloads exactly this.
          COMUX_ASSET="comux-v${VERSION}-x86_64-linux"
          cp target/release/comux "${COMUX_ASSET}"
          echo "COMUX_ASSET=${COMUX_ASSET}" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.COMUX_ASSET }}
          if-no-files-found: error

  build-macos:
    name: Build macOS arm64
    # macos-15 = arm64 + Xcode 16. copad-macos/Package.swift declares
    # swift-tools-version 6.0 (so macos-14's Swift 5.10 errors at manifest
    # parse), and the Swift sources use trailing commas in parameter lists
    # (SE-0439, Swift 6.1+) — so the default Xcode on macos-15 (Swift 6.0)
    # ALSO fails. The setup-xcode action below picks the newest stable
    # Xcode installed on the runner image, which is currently 16.3+ /
    # Swift 6.1+. Keep this even if the runner image upgrades — it makes
    # the toolchain selection explicit instead of relying on whichever
    # Xcode happens to be at /Applications/Xcode.app.
    runs-on: macos-15
    # Developer ID signing + notarization is gated on these secrets. When they
    # are absent (a fork, or before they are configured) the Stage step logs
    # "signing secrets absent" and falls back to ad-hoc signing, so the build
    # never fails for lack of credentials. Setup guide:
    # docs/macos-signing-notarization.md.
    env:
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      # Notarization via App Store Connect API key (notarytool --key/--key-id/--issuer).
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Import the Developer ID Application cert into a throwaway keychain so
      # codesign can find the identity by name in the Stage step. No-op when the
      # cert secret is absent (ad-hoc fallback). See docs/macos-signing-notarization.md.
      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # NOTE: -e is intentionally OFF. A cert-import failure (missing
          # password, wrong password, malformed p12) must NOT abort the job —
          # the Stage step's all-secrets gate then finds no identity and falls
          # back to ad-hoc signing. So every failure here warns and exit 0s.
          set -uo pipefail
          if [ -z "${MACOS_CERTIFICATE_BASE64:-}" ] || [ -z "${MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "signing cert secrets incomplete (need BASE64 + PASSWORD) — skipping import (ad-hoc fallback)"
            exit 0
          fi
          fallback() { echo "WARNING: $1 — release will fall back to ad-hoc signing. Check the MACOS_CERTIFICATE_* secrets."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/copad-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN" || fallback "create-keychain failed"
          security set-keychain-settings -lut 21600 "$KEYCHAIN" || true
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN" || fallback "unlock-keychain failed"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12" || fallback "base64 decode of cert failed"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            || fallback "cert import failed (wrong password or malformed .p12?)"
          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null \
            || fallback "set-key-partition-list failed"
          # Put our keychain first in the search list so the identity resolves.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g) || true
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "imported: $(security find-identity -v -p codesigning "$KEYCHAIN" | grep -c 'Developer ID Application') Developer ID Application identity(ies)"

      # copad-linux depends on GTK4/VTE so `cargo build --workspace` fails
      # on Darwin. List the macOS-buildable crates explicitly. Keep the
      # plugin set in sync with install-macos.sh's MACOS_PLUGINS array.
      - name: Build Rust crates (workspace minus copad-linux)
        run: |
          # Stamp the tag's version into the workspace (see the Linux job) so
          # comux/coctl self-report their true version.
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo build --release \
            -p copad-ffi \
            -p copad-term \
            -p copad-cli \
            -p copad-mux \
            -p copad-daemon \
            -p copad-plugin-echo \
            -p copad-plugin-git \
            -p copad-plugin-llm \
            -p copad-plugin-calendar \
            -p copad-plugin-kb \
            -p copad-plugin-todo \
            -p copad-plugin-bookmark \
            -p copad-plugin-slack \
            -p copad-plugin-discord \
            -p copad-plugin-jira \
            -p copad-plugin-docs \
            -p copad-plugin-claude \
            -p copad-plugin-pilot \
            -p copad-plugin-web-bridge

      - name: Build Swift app
        working-directory: copad-macos
        run: swift build -c release

      - name: Stage Copad.app + ad-hoc codesign + assemble tarball
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="copad-v${VERSION}-aarch64-apple-darwin.tar.gz"

          REPO_ROOT="$(pwd)"
          DIST="$REPO_ROOT/dist-macos"
          rm -rf "$DIST"
          mkdir -p "$DIST"

          # ---- Copad.app bundle ----
          STAGING="$DIST/Copad.app"
          MACOS_DIR="$STAGING/Contents/MacOS"
          RESOURCES="$STAGING/Contents/Resources"
          mkdir -p "$MACOS_DIR" "$RESOURCES"
          cp copad-macos/.build/release/Copad "$MACOS_DIR/Copad"
          if [[ -f copad-macos/Resources/AppIcon.icns ]]; then
            cp copad-macos/Resources/AppIcon.icns "$RESOURCES/AppIcon.icns"
          fi

          # Info.plist gets the release tag's version baked into both
          # CFBundleVersion and CFBundleShortVersionString. LSMinimumSystemVersion
          # mirrors install-macos.sh.
          cat > "$STAGING/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>Copad</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundleIdentifier</key>
              <string>com.marshall.copad</string>
              <key>CFBundleName</key>
              <string>copad</string>
              <key>CFBundleDisplayName</key>
              <string>copad</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>14.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
              <key>NSPrincipalClass</key>
              <string>NSApplication</string>
          </dict>
          </plist>
          EOF

          # Signing is DEFERRED until after every binary (CLIs + plugins) is
          # staged into $DIST, so a single pass can Developer-ID-sign them all
          # and then notarize the app. See the "Sign + notarize" block below.

          # ---- Top-level CLI binaries ----
          cp target/release/coctl "$DIST/coctl"
          cp target/release/copadd "$DIST/copadd"
          cp target/release/comux "$DIST/comux"

          # ---- Plugins (binary + plugin.toml + panel.html / triggers.example.toml) ----
          # Layout matches what install-macos.sh writes into
          # ~/Library/Application Support/copad/plugins/<name>/. PluginSupervisor
          # resolves `services.exec` against the plugin dir first, so the
          # binary co-located with the manifest wins over $PATH lookup.
          # Keep this list in sync with install-macos.sh's MACOS_PLUGINS array
          # AND the Build Rust crates step above.
          mkdir -p "$DIST/plugins"
          for name in echo git llm calendar kb todo bookmark slack discord jira docs claude pilot web-bridge; do
            crate="copad-plugin-$name"
            src_dir="plugins/$name"
            bin_src="target/release/$crate"
            plugin_dir="$DIST/plugins/$name"
            mkdir -p "$plugin_dir"
            find "$src_dir" -maxdepth 1 -type f ! -name 'Cargo.toml' \
              -exec cp -f {} "$plugin_dir/" \;
            cp -f "$bin_src" "$plugin_dir/$crate"
            chmod 755 "$plugin_dir/$crate"
          done

          # ---- Shell hooks (live-cwd tracking for session restore) ----
          mkdir -p "$DIST/shell-hooks"
          cp copad-macos/shell-hooks/copad-cwd.* "$DIST/shell-hooks/"
          # Phase 22.1 context bridge (zsh) — install-macos.sh ships this too;
          # keep the prebuilt installer's shell-hook set in parity.
          cp examples/shell/copad-context.zsh "$DIST/shell-hooks/"

          # ---- LaunchAgent plist + launch wrapper (HOME_PLACEHOLDER
          #      unexpanded; downstream consumers — install.sh, install-macos.sh —
          #      substitute their own path, since launchd does not expand `~`).
          #      The plist runs copadd through the wrapper (sources
          #      ~/.config/copad/secrets.env before exec), so ship BOTH: an
          #      installer that lays down the plist without the wrapper would
          #      create a LaunchAgent pointing at a missing script. ----
          cp dist/launchd/com.marshall.copad.daemon.plist "$DIST/com.marshall.copad.daemon.plist"
          cp dist/launchd/copadd-launch.sh "$DIST/copadd-launch.sh"

          # ---- Sign + notarize ----
          # With signing secrets present: Developer-ID-sign EVERY Mach-O
          # (CLIs + plugin binaries + the app) with a hardened runtime and a
          # secure timestamp, then notarize + staple the .app only (the CLIs
          # are terminal-run, where a Developer ID signature already suffices,
          # and per the chosen scope only the app is notarized). Signing all
          # binaries — not just the app — is required so macOS 26 (Tahoe) does
          # not delete the ad-hoc executables (copadd, plugins) on first spawn.
          # Without secrets: fall back to the previous ad-hoc signature so the
          # build still works on forks. See docs/macos-signing-notarization.md.
          #
          # Gate on ALL required inputs, not just the identity: require the
          # signing identity + the three App Store Connect API-key secrets
          # (notarytool auth) AND that the cert actually imported into the
          # keychain (so a partial config — e.g. identity set but cert or an API
          # secret missing — takes the ad-hoc fallback instead of failing the
          # release at codesign/notarytool).
          if [ -n "${MACOS_SIGNING_IDENTITY:-}" ] \
             && [ -n "${APP_STORE_CONNECT_KEY_ID:-}" ] \
             && [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ] \
             && [ -n "${APP_STORE_CONNECT_KEY_P8:-}" ] \
             && security find-identity -v -p codesigning | grep -qF "$MACOS_SIGNING_IDENTITY"; then
            echo "==> Developer ID signing (identity: $MACOS_SIGNING_IDENTITY)"
            # Sign leaf binaries first (inside-out): CLIs, then every plugin.
            for b in "$DIST/coctl" "$DIST/copadd" "$DIST/comux"; do
              codesign --force --options runtime --timestamp \
                --sign "$MACOS_SIGNING_IDENTITY" "$b"
            done
            find "$DIST/plugins" -type f -name 'copad-plugin-*' -perm -u+x -print0 \
              | while IFS= read -r -d '' pbin; do
                  codesign --force --options runtime --timestamp \
                    --sign "$MACOS_SIGNING_IDENTITY" "$pbin"
                done
            # Then the app bundle (signs its Contents/MacOS/Copad executable).
            codesign --force --options runtime --timestamp \
              --sign "$MACOS_SIGNING_IDENTITY" "$STAGING"
            codesign --verify --strict --verbose=2 "$STAGING"

            echo "==> notarizing $STAGING (App Store Connect API key)"
            # Restore the .p8 from the secret — accept either a raw PEM key or a
            # base64-encoded one (the setup guide recommends base64).
            P8="$RUNNER_TEMP/AuthKey.p8"
            # Guarantee the private key is wiped even if decode/ditto/submit
            # fails under set -e — don't leave it in $RUNNER_TEMP.
            trap 'rm -f "$P8"' EXIT
            if printf '%s' "$APP_STORE_CONNECT_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
              printf '%s' "$APP_STORE_CONNECT_KEY_P8" > "$P8"
            else
              printf '%s' "$APP_STORE_CONNECT_KEY_P8" | base64 --decode > "$P8"
            fi
            ditto -c -k --keepParent "$STAGING" "$RUNNER_TEMP/Copad.zip"
            xcrun notarytool submit "$RUNNER_TEMP/Copad.zip" \
              --key "$P8" \
              --key-id "$APP_STORE_CONNECT_KEY_ID" \
              --issuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --wait
            xcrun stapler staple "$STAGING"
            xcrun stapler validate "$STAGING"
            spctl -a -vvv --type exec "$STAGING" || true
          else
            echo "==> signing not fully configured (need MACOS_SIGNING_IDENTITY + APP_STORE_CONNECT_{KEY_ID,ISSUER_ID,KEY_P8} + an importable cert) — ad-hoc signing (Gatekeeper needs quarantine strip; not Tahoe-safe)"
            codesign --force --deep --sign - --timestamp=none "$STAGING"
            codesign -dv "$STAGING" 2>&1 | head -5 || true
          fi

          # ---- Pack ----
          # Strip the dist-macos/ prefix so consumers see Copad.app / coctl / …
          # at the tarball root.
          tar -czf "$ARCHIVE" -C "$DIST" .
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"
          # Standalone comux binary asset (see the Linux job + install-comux.sh).
          # Copy from $DIST/comux — the copy the Sign+notarize block above
          # signed — so the comux-only installer gets a Developer-ID-signed
          # (Tahoe-safe) binary, not the unsigned target/release/comux.
          COMUX_ASSET="comux-v${VERSION}-aarch64-apple-darwin"
          cp "$DIST/comux" "$COMUX_ASSET"
          echo "COMUX_ASSET=${COMUX_ASSET}" >> "$GITHUB_ENV"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-aarch64
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.COMUX_ASSET }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install git-cliff
        run: cargo install git-cliff --locked

      - name: Generate release notes
        run: git-cliff --latest --strip header -o RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/linux-x86_64/*.tar.gz
            artifacts/macos-aarch64/*.tar.gz
            artifacts/linux-x86_64/comux-*
            artifacts/macos-aarch64/comux-*
          generate_release_notes: false
