<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>copad</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#1e1e2e">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
        crossorigin="anonymous">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"
          crossorigin="anonymous"></script>

  <!-- type="module" so it is deferred: it must run after the two classic xterm scripts
       above have executed and after #root is parsed, which the old inline script got by
       being last in <body>. Module scope is also what lets WU4b export anything. -->
  <script type="module" src="/app.js"></script>
</body>
</html>
