[package]
name = "copad-plugin-discord"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "First-party Discord service plugin for copad — connects via Gateway WebSocket, emits discord.message / discord.mention / discord.dm events."
repository.workspace = true

[[bin]]
name = "copad-plugin-discord"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-certs: trust the OS store so a corporate CA that re-signs TLS is trusted (see llm plugin).
ureq = { version = "2", default-features = false, features = ["json", "tls", "native-certs"] }
# native-roots trusts the OS store (corporate CA) for the gateway WSS; webpki-roots kept as a
# fallback (both are added to the root store — tungstenite runs both cfg blocks).
tungstenite = { version = "0.24", default-features = false, features = [
    "handshake",
    "rustls-tls-webpki-roots",
    "rustls-tls-native-roots",
] }
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "sync-secret-service",
    "crypto-rust",
] }
