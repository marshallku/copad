[plugin]
name = "bookmark"
title = "Bookmarks"
version = "0.1.0"
description = "URL → KB note. Captures bookmarks under ~/docs/bookmarks/YYYY-MM/<urlhash8>-<slug>.md (override root with COPAD_BOOKMARK_ROOT). Filesystem is the source of truth — vim/git-edit safe."

[[services]]
name = "main"
exec = "copad-plugin-bookmark"
# onAction: no watcher and no events, so nothing needs to run at startup.
activation = "onAction:bookmark.*"
restart = "on-crash"
provides = [
    "bookmark.add",
    "bookmark.list",
    "bookmark.show",
    "bookmark.delete",
]
subscribes = []
# Optional env:
#   COPAD_BOOKMARK_ROOT (default ~/docs/bookmarks)

# No [[panels]]: `coctl plugin open bookmark` fails; use `coctl bookmark` subcommands or
# `coctl call bookmark.<action>` instead.
